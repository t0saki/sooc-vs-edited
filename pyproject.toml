[project]
name = "sooc-vs-edited"
version = "0.1.0"
description = "Compare straight-out-of-camera JPEGs against edited RAW exports, side by side, and export your picks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zhengxiao Wu" }]
keywords = ["photography", "raw", "sooc", "culling", "lightroom", "comparison"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
  "opencv-python-headless>=4.8",
]

[project.urls]
Homepage = "https://github.com/t0saki/sooc-vs-edited"
Issues = "https://github.com/t0saki/sooc-vs-edited/issues"

[project.scripts]
sooc-vs-edited = "sooc_vs_edited.cli:main"
svse = "sooc_vs_edited.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sooc_vs_edited"]
